spring.application.name=banco

# H2 en memoria: la base vive solo mientras corre la app
spring.datasource.url=jdbc:h2:mem:banco
spring.datasource.driverClassName=org.h2.Driver
spring.datasource.username=sa
spring.datasource.password=

# Hibernate crea/actualiza tablas según tus @Entity
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Consola web de H2: http://localhost:8080/h2-console
# JDBC URL a usar en la consola: jdbc:h2:mem:banco
spring.h2.console.enabled=true
spring.h2.console.path=/h2-console
